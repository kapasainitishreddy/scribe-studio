name: Deploy Scribe Studio to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scribe-studio-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production frontend
        env:
          VITE_AGENT_API_BASE_URL: ${{ vars.AGENT_API_BASE_URL }}
        run: npm run build

      - name: Report backend wiring
        shell: bash
        env:
          AGENT_API_BASE_URL: ${{ vars.AGENT_API_BASE_URL }}
        run: |
          if [ -n "$AGENT_API_BASE_URL" ]; then
            echo "Pages bundle is wired to the production agent service."
          else
            echo "AGENT_API_BASE_URL is not configured; frontend will retain graceful offline behavior for server-backed operations."
          fi

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Deploy dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
