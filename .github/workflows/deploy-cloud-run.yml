name: Deploy Google Cloud Run Agent Service

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-cloud-run.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'scribe-studio-production' }}
  SERVICE_NAME: scribe-studio-agent-service
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Check Cloud Run credentials
      id: credentials
      shell: bash
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      run: |
        if [ -n "$GCP_SA_KEY" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Cloud Run credentials detected; deployment will continue."
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "GCP_SA_KEY is not configured; skipping Cloud Run deployment without failing CI."
        fi

    - name: Checkout code
      if: steps.credentials.outputs.enabled == 'true'
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      if: steps.credentials.outputs.enabled == 'true'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      if: steps.credentials.outputs.enabled == 'true'
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy to Cloud Run
      if: steps.credentials.outputs.enabled == 'true'
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        source: ./server
        env_vars: |
          NODE_ENV=production
          GIT_COMMIT=${{ github.sha }}
          ALLOWED_ORIGINS=https://kapasainitishreddy.github.io,http://localhost:5173
        secrets: |
          PARALLEL_API_KEY=PARALLEL_API_KEY:latest
          GEMINI_API_KEY=GEMINI_API_KEY:latest
