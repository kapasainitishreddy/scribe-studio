name: Final UI Feedback Polish (One-Time)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/final-ui-feedback-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write regression test and prove RED state
        shell: bash
        run: |
          cat > tests/uiFeedbackIntegration.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { describe, expect, it } from "vitest";

          const source = (path: string) => readFileSync(resolve(process.cwd(), path), "utf8");

          describe("workspace UI feedback integration", () => {
            it("routes Perform take and sides feedback through Sonner", () => {
              const perform = source("src/components/desk/PerformWorkspace.tsx");
              expect(perform).toContain('import { toast } from "sonner";');
              expect(perform).toContain("toast.success(`Take ${takeNumber} captured`)");
              expect(perform).toContain('toast.success("Actor sides PDF exported")');
              expect(perform).not.toContain("downloadSuccess");
            });

            it("uses toast.promise for Parallel ground-truth research", () => {
              const produce = source("src/components/desk/ProduceWorkspace.tsx");
              expect(produce).toContain('import { toast } from "sonner";');
              expect(produce).toContain("toast.promise(researchPromise");
              expect(produce).toContain("Ground-truth research verified and added to the production desk.");
            });

            it("confirms screenplay quick-format insertions through Sonner", () => {
              const write = source("src/components/desk/WriteWorkspace.tsx");
              expect(write).toContain('import { toast } from "sonner";');
              expect(write).toContain("format inserted");
            });

            it("keeps the global Sonner host mounted", () => {
              const app = source("src/App.tsx");
              expect(app).toContain('import { Toaster } from "sonner";');
              expect(app).toContain("<Toaster");
            });
          });
          EOF

          if npx vitest run tests/uiFeedbackIntegration.test.ts; then
            echo 'ERROR: regression test unexpectedly passed before production changes.'
            exit 1
          else
            echo 'RED confirmed: the regression test detects the missing workspace feedback wiring.'
          fi

      - name: Apply minimal production patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Perform: replace local success banner with Sonner and make take controls observable.
          replace_exact(
              "src/components/desk/PerformWorkspace.tsx",
              'import React, { useState, useMemo, useEffect } from "react";\n',
              'import React, { useState, useMemo, useEffect } from "react";\nimport { toast } from "sonner";\n',
          )
          replace_exact(
              "src/components/desk/PerformWorkspace.tsx",
              '  const [downloadSuccess, setDownloadSuccess] = useState<string | null>(null);\n',
              '',
          )
          replace_exact(
              "src/components/desk/PerformWorkspace.tsx",
              '    setDownloadSuccess("Sides PDF generated!");\n    setTimeout(() => setDownloadSuccess(null), 3000);\n',
              '    toast.success("Actor sides PDF exported");\n',
          )
          replace_exact(
              "src/components/desk/PerformWorkspace.tsx",
              '    toast.success("Actor sides PDF exported");\n  };\n\n  return (\n',
              '    toast.success("Actor sides PDF exported");\n  };\n\n  const handleToggleRecording = () => {\n    const nextRecording = !isRecording;\n    setIsRecording(nextRecording);\n    if (nextRecording) {\n      toast.info(`Take ${takeNumber} recording started`);\n    } else {\n      toast.success(`Take ${takeNumber} captured`);\n    }\n  };\n\n  return (\n',
          )
          replace_exact(
              "src/components/desk/PerformWorkspace.tsx",
              '                onClick={() => setIsRecording(!isRecording)}\n',
              '                onClick={handleToggleRecording}\n',
          )
          replace_exact(
              "src/components/desk/PerformWorkspace.tsx",
              '        {downloadSuccess && (\n          <div className="fixed bottom-12 right-6 p-3 rounded-lg bg-[#10B981] text-black font-semibold text-xs shadow-xl animate-fade-in">\n            {downloadSuccess}\n          </div>\n        )}\n',
              '',
          )

          # Produce: expose loading, success, and failure states for the async Parallel operation.
          replace_exact(
              "src/components/desk/ProduceWorkspace.tsx",
              'import React, { useState, useMemo } from "react";\n',
              'import React, { useState, useMemo } from "react";\nimport { toast } from "sonner";\n',
          )
          replace_exact(
              "src/components/desk/ProduceWorkspace.tsx",
              '''  const handleSearch = async (e: React.FormEvent) => {\n    e.preventDefault();\n    if (!searchQuery.trim() || isSearching) return;\n    setIsSearching(true);\n    try {\n      await onRunParallelResearch(searchQuery.trim());\n      setSearchQuery("");\n    } finally {\n      setIsSearching(false);\n    }\n  };\n''',
              '''  const handleSearch = async (e: React.FormEvent) => {\n    e.preventDefault();\n    const query = searchQuery.trim();\n    if (!query || isSearching) return;\n\n    setIsSearching(true);\n    const researchPromise = onRunParallelResearch(query);\n    toast.promise(researchPromise, {\n      loading: `Parallel Search verifying: ${query}`,\n      success: "Ground-truth research verified and added to the production desk.",\n      error: (error) =>\n        `Parallel research failed: ${error instanceof Error ? error.message : "Unknown error"}`\n    });\n\n    try {\n      await researchPromise;\n      setSearchQuery("");\n    } catch {\n      // toast.promise owns the user-facing failure state.\n    } finally {\n      setIsSearching(false);\n    }\n  };\n''',
          )

          # Write: confirm quick-format commands without introducing additional local state.
          replace_exact(
              "src/components/desk/WriteWorkspace.tsx",
              'import React, { useState, useRef, useMemo } from "react";\n',
              'import React, { useState, useRef, useMemo } from "react";\nimport { toast } from "sonner";\n',
          )
          replace_exact(
              "src/components/desk/WriteWorkspace.tsx",
              '    onUpdateScreenplay(nextVal);\n    setTimeout(() => {\n',
              '    onUpdateScreenplay(nextVal);\n    const formatLabel = prefix.trim() || "Action";\n    toast.success(`${formatLabel} format inserted`, { duration: 1200 });\n    setTimeout(() => {\n',
          )
          PY

      - name: Prove GREEN state for regression test
        run: npx vitest run tests/uiFeedbackIntegration.test.ts

      - name: Typecheck monorepo
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Run agent evaluation benchmark
        run: npm run eval

      - name: Build production frontend
        run: npm run build

      - name: Build Google ADK agent service
        run: |
          cd server
          npm ci
          npm run build

      - name: Commit verified polish and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/final-ui-feedback-polish.yml
          git config user.name "scribe-studio-verifier"
          git config user.email "scribe-studio-verifier@users.noreply.github.com"
          git add src/components/desk/PerformWorkspace.tsx \
                  src/components/desk/ProduceWorkspace.tsx \
                  src/components/desk/WriteWorkspace.tsx \
                  tests/uiFeedbackIntegration.test.ts \
                  .github/workflows/final-ui-feedback-polish.yml
          git commit -m "fix(ui): finish workspace feedback polish [verified]"
          git push origin HEAD:main
